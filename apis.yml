aid: veza
name: Veza
description: >-
  Veza is an identity security platform. Its Open Authorization API (OAA)
  publishes identity, resource, and authorization metadata from custom or
  unsupported applications into the Veza Entity Catalog, making access across
  systems searchable and governable for least-privilege enforcement, access
  reviews, and rules and alerts. The REST API manages custom providers and their
  data sources, pushes OAA JSON payloads (users, groups, roles, resources,
  permissions), and runs authorization assessment queries and reports. It
  authenticates with a per-tenant API key presented as a bearer token, with
  official Python and C# SDKs and a command-line client.
